<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="使用 HTML、CSS 與 JavaScript 製作的 Pac-Man Adventure 遊戲"
    />

    <title>Pac-Man Adventure</title>

    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <main class="start-screen">
      <section class="start-panel">
        <p class="game-label">HTML・CSS・JavaScript Game</p>

        <h1 class="game-title">
          <span>PAC-MAN</span>
          <span class="game-title-sub">ADVENTURE</span>
        </h1>

        <!-- 使用 CSS 畫出 Pac-Man，目前不需要圖片 -->
        <div class="pacman-logo" aria-hidden="true"></div>

        <!-- 進入遊戲頁面時會建立全新的分數、生命與第一關。 -->
        <a class="start-button" href="./game.html">Start Game</a>

        <div class="instructions">
          <p>使用方向鍵或 WASD 移動</p>
          <p>吃完所有豆子即可過關</p>
        </div>

        <p class="version">Version 1.0.0</p>
      </section>
    </main>
  </body>
</html>
